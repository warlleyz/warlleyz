name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: warlleyz

          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%232563eb&color_dots=%23ebedf0,%23bfdbfe,%2393c5fd,%2360a5fa,%232563eb
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%2360a5fa&color_dots=%23161b22,%23172554,%231e3a8a,%232563eb,%2360a5fa

      - name: Publish Snake
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
          target_branch: output

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}